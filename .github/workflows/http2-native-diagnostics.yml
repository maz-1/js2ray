name: HTTP2 native lifecycle regression
on:
  workflow_dispatch:
  push:
    paths:
      - 'transports/**'
      - 'runtime/**'
      - 'config/**'
      - 'test/xmux.test.js'
      - 'test/helpers.js'
      - 'package*.json'
      - '.github/workflows/http2-native-diagnostics.yml'
permissions:
  contents: read
jobs:
  lifecycle:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Repeat the normal test worker lifecycle
        shell: bash
        run: |
          mkdir -p test-results/http2-native
          for attempt in $(seq 1 12); do
            log="test-results/http2-native/attempt-${attempt}.txt"
            node --test --test-timeout=15000 --test-reporter=tap test/xmux.test.js > "$log" 2>&1
            tail -n 10 "$log"
          done
      - name: Install native memory diagnostics
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends valgrind libc6-dbg
      - name: Check HTTP2 native memory access
        shell: bash
        run: |
          valgrind --error-exitcode=99 --error-limit=no --undef-value-errors=no \
            --log-file=test-results/http2-native/memcheck.txt \
            node --jitless --test --test-isolation=none --test-timeout=120000 \
            --test-reporter=tap test/xmux.test.js > test-results/http2-native/memcheck-tests.txt 2>&1
          tail -n 10 test-results/http2-native/memcheck-tests.txt
          tail -n 18 test-results/http2-native/memcheck.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: http2-native-diagnostics
          # Never upload core memory, which can include runner credentials.
          path: test-results/http2-native/*.txt
          if-no-files-found: error
          retention-days: 30
